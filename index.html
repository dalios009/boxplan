<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b12">
<title>BoxPlan — Boxing & Shift Planner</title>
<style>
:root{color-scheme:dark;--bg:#090b12;--card:#141824;--line:#292f40;--text:#f3f5fa;--muted:#969fb4;--red:#ff573f;--green:#4cdb9b;--yellow:#ffc85c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
header{padding:22px 18px 12px;max-width:850px;margin:auto}
header small,.muted{color:var(--muted)}
h1{font-size:27px;letter-spacing:-1px;margin:0}
main{max-width:850px;margin:auto;padding:10px 16px 100px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#10131df2;border-top:1px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:10}
nav button{flex:1;max-width:170px;border:0;background:none;color:var(--muted);padding:9px 2px;font-size:12px}
nav button.active{color:var(--red)}
nav b{display:block;font-size:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:16px;margin:12px 0}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
h2{font-size:18px;margin:0 0 12px}
h3{font-size:15px;margin:0 0 5px}
p{margin:7px 0}
.big{font-size:32px;font-weight:800;letter-spacing:-1px}
.muted{font-size:13px}
.btn{border:0;border-radius:11px;background:var(--red);color:white;font-weight:750;padding:11px 14px}
.btn.secondary{background:#252b3a;color:var(--text)}
.btn.small{padding:7px 10px;font-size:13px}
input,select{background:#0d111b;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-width:0}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 5px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{padding:13px;background:#0e121c;border-radius:12px}
.badge{display:inline-block;border-radius:7px;padding:4px 8px;font-size:12px;font-weight:800;background:#292e3e}
.badge.D{color:#ffd16b}.badge.N{color:#a9aaff}.badge.O{color:var(--green)}
.badge.V{color:#ffb5a9}
.list{display:flex;gap:11px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.list:last-child{border-bottom:0}
.list input[type=checkbox]{width:21px;height:21px;accent-color:var(--red);margin-top:3px}
.list.done{opacity:.55}
.list.done .task{text-decoration:line-through}
.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.day{min-width:0;aspect-ratio:1;border:1px solid var(--line);border-radius:9px;background:#111521;color:var(--text);padding:3px;font-size:12px}
.day.D{background:#382c16}.day.N{background:#202044}.day.O{background:#153127}.day.V{background:#40231f}
.day.selected{outline:2px solid var(--red)}
.day .mark{display:block;font-size:10px}
.timer{font-size:clamp(44px,13vw,68px);font-weight:850;letter-spacing:-3px;text-align:center;font-variant-numeric:tabular-nums}
.timerbar{height:7px;border-radius:9px;background:#303649;overflow:hidden;margin:16px 0}
.timerbar div{height:100%;width:0;background:var(--red)}
.preset{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}
.preset button{flex:1;min-width:65px}
.exercise{padding:10px 0;border-bottom:1px solid var(--line)}
.exercise:last-child{border-bottom:0}
.exercise strong{display:block}
.notice{border-left:3px solid var(--yellow);padding:9px 12px;background:#242014;border-radius:5px;font-size:13px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}
@media(min-width:600px){main{padding-top:16px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<header>
 <div class="row between">
  <div><small>YOUR PERSONAL TRAINING SYSTEM</small><h1>🥊 BoxPlan</h1></div>
  <button class="btn secondary small" onclick="exportData()">Backup ↗</button>
 </div>
</header>
<main id="app"></main>
<nav id="nav"></nav>
<script>
"use strict";

/* Keep the original BoxPlan storage key and preserve its existing data. */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,"0");
const key=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const dateOf=k=>{const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)};
const shiftDate=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));

let old={};
try{old=JSON.parse(localStorage.getItem("bp")||"{}")||{}}catch(e){}
let saved={};
try{saved=JSON.parse(localStorage.getItem("boxplan_v4")||"{}")||{}}catch(e){}

const defaults={
 anchor:"2026-10-15",
 cycle:["D","N","O","O"],
 overrides:{},done:{},history:[],recovery:{},
 settings:{round:180,rest:60,rounds:3,club:2},
 timer:{},tab:"today",selected:key(today()),
 old:old
};
let S={...defaults,...saved};
S.settings={...defaults.settings,...(S.settings||{})};
S.overrides=S.overrides||{};
S.done=S.done||{};
S.history=S.history||[];
S.recovery=S.recovery||{};
S.cycle=Array.isArray(S.cycle)&&S.cycle.length?S.cycle:["D","N","O","O"];
S.old=S.old||old;

function save(){
 try{localStorage.setItem("boxplan_v4",JSON.stringify(S))}
 catch(e){alert("Storage is full. Export a backup before continuing.")}
}
function migrate(){
 /* Copy old calendar overrides, completions and equipment checks without
    overwriting the original bp object. */
 const o=S.old||{};
 S.overrides={...(o.ov||{}),...(S.overrides||{})};
 S.done={...(o.done||{}),...(S.done||{})};
 S.kit={...(o.kit||{}),...(S.kit||{})};
}
migrate();

function type(d){
 const k=key(d);
 if(S.overrides[k])return S.overrides[k];
 const a=dateOf(S.anchor||key(today()));
 const diff=Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-
  Date.UTC(a.getFullYear(),a.getMonth(),a.getDate()))/86400000);
 return S.cycle[((diff%S.cycle.length)+S.cycle.length)%S.cycle.length]||"O";
}
const labels={D:["☀️","Day shift","09:00–21:00"],N:["🌙","Night shift","21:00–09:00"],O:["💤","Day off","Recovery / training"],V:["🏖️","Vacation","Light training / rest"]};

const plans={
 technique:[
 ["Warm-up","Jump rope, shoulder mobility and light movement","10 min"],
 ["Footwork","Step forward/backward, lateral steps, pivot after jab","4 × 2 min"],
 ["Jab development","Single jab, double jab, jab while moving","4 × 2 min"],
 ["Defense","Slip, roll, step back, parry; return with a counter","4 × 2 min"],
 ["Combinations","Jab–cross, jab–cross–hook, body-head combinations","4 × 2 min"],
 ["Cool-down","Easy breathing, gentle mobility, note one improvement","5 min"]
 ],
 conditioning:[
 ["Warm-up","Easy rope and dynamic mobility","8 min"],
 ["Rope rounds","Relaxed rhythm; maintain posture and breathing","4 × 3 min"],
 ["Shadowboxing","Footwork and clean technique, not maximum speed","3 × 3 min"],
 ["Bodyweight circuit","Push-ups, squats, rows or band pulls, plank","3 rounds"],
 ["Cool-down","Walk and gentle stretching","5 min"]
 ],
 recovery:[
 ["Easy movement","Comfortable walk or very easy cycling","15–30 min"],
 ["Mobility","Hips, ankles, thoracic spine and shoulders","10 min"],
 ["Technique","Optional relaxed shadowboxing, no hard intervals","3 × 2 min"],
 ["Review","Record energy, sleep and any pain","2 min"]
 ],
 shadow:[
 ["Warm-up","Relax shoulders, easy bounce, stance and guard","5 min"],
 ["Round 1","Jab only: range, balance, quick return to guard","3 min"],
 ["Round 2","Jab–cross with exits and lateral movement","3 min"],
 ["Round 3","Slip or parry, then counter; stay balanced","3 min"],
 ["Round 4","Free shadowboxing: accuracy and relaxed breathing","3 min"],
 ["Cool-down","Breathing and light mobility","5 min"]
 ]
};

function recommend(d){
 const t=type(d),prev=type(shiftDate(d,-1)),next=type(shiftDate(d,1));
 if(t==="V")return {name:"Recovery session",kind:"recovery",why:"Keep the session easy; vacation is not a requirement to train hard."};
 if(t==="D")return {name:"Short technique session",kind:"shadow",why:"Keep training short before a 09:00–21:00 shift. Skip it if sleep is insufficient."};
 if(t==="N"&&prev==="N")return {name:"Post-shift recovery",kind:"recovery",why:"After working overnight, sleep takes priority. Avoid hard training before recovery sleep."};
 if(t==="N")return {name:"Pre-shift technique",kind:"shadow",why:"A short session before a 21:00–09:00 shift. Finish well before leaving for work."};
 if(prev==="N")return {name:"Recovery after night shift",kind:"recovery",why:"Protect daytime sleep. Train lightly only when rested."};
 return {name:"Boxing technique",kind:"technique",why:"Use the free day for skill development; increase intensity only when recovered."};
}
function recovery(d){
 return S.recovery[key(d)]||{sleep:7,energy:3,soreness:1};
}
function workout(d){
 const r=recovery(d);
 if(r.sleep<5||r.energy<=1||r.soreness>=4)
  return {name:"Recovery only",kind:"recovery",why:"Your recovery score is low. Prioritize sleep and gentle movement."};
 return recommend(d);
}
function escape(s){
 return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function completed(k){return Object.keys(S.done).filter(x=>x.startsWith(k+"|")&&S.done[x]).length}
function totalCompleted(){return Object.values(S.done).filter(Boolean).length}
function sessionCount(){return S.history.length}
function weekStats(){
 const start=shiftDate(today(),-6),days=[];
 for(let i=0;i<7;i++)days.push(key(shiftDate(start,i)));
 return days.filter(k=>Object.keys(S.done).some(x=>x.startsWith(k+"|")&&S.done[x])).length;
}
function card(s){return '<section class="card">'+s+'</section>'}
function btn(label,fn,cls=""){
 return '<button class="btn '+cls+'" onclick="'+fn+'">'+label+'</button>';
}
function render(){
 $("#nav").innerHTML=[
 ["today","🏠","Today"],["calendar","📅","Schedule"],["coach","🥊","Coach"],["timer","⏱️","Timer"],["progress","📈","Progress"]
 ].map(([id,icon,name])=>'<button class="'+(S.tab===id?"active":"")+'" onclick="tab(\''+id+'\')"><b>'+icon+'</b>'+name+'</button>').join("");
 const views={today:viewToday,calendar:viewCalendar,coach:viewCoach,timer:viewTimer,progress:viewProgress};
 $("#app").innerHTML=(views[S.tab]||viewToday)();
 save();
}
function tab(t){S.tab=t;render()}
function selectDay(k){S.selected=k;S.tab="today";render()}
function viewToday(){
 const d=dateOf(S.selected||key(today())),k=key(d),t=type(d),m=labels[t],w=workout(d),r=recovery(d);
 const list=plans[w.kind]||plans.technique;
 const items=list.map((x,i)=>{
  const id=k+"|"+i,done=!!S.done[id];
  return '<div class="list '+(done?"done":"")+'"><input type="checkbox" '+(done?"checked":"")+' onchange="toggleTask(\''+id+'\')"><div class="grow"><strong class="task">'+escape(x[0])+'</strong><p>'+escape(x[1])+'</p><small class="muted">'+escape(x[2])+'</small></div></div>';
 }).join("");
 return '<div class="row between"><div><div class="muted">'+d.toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long",year:"numeric"})+'</div><h2 style="margin:4px 0">Your day</h2></div>'+btn("Today","selectDay(\''+key(today())+'\')","secondary small")+'</div>'+
 card('<div class="row"><span style="font-size:34px">'+m[0]+'</span><div class="grow"><span class="badge '+t+'">'+m[1]+'</span><h2 style="margin:6px 0">'+m[2]+'</h2><div class="muted">'+k+'</div></div></div>')+
 card('<div class="row between"><div><div class="muted">Recommended workout</div><h2 style="margin:4px 0">'+escape(w.name)+'</h2></div><span style="font-size:28px">🥊</span></div><p class="muted">'+escape(w.why)+'</p><div class="grid"><div class="stat"><div class="muted">Sleep</div><strong>'+r.sleep+' h</strong></div><div class="stat"><div class="muted">Energy</div><strong>'+r.energy+'/5</strong></div><div class="stat"><div class="muted">Soreness</div><strong>'+r.soreness+'/5</strong></div></div><p>'+btn("Start round timer","tab(\'timer\')")+' '+btn("Edit recovery","tab(\'progress\')","secondary")+'</p>')+
 '<h2>Session checklist</h2>'+card(items+'<div class="row between"><span class="muted">'+completed(k)+' of '+list.length+' complete</span>'+btn("Reset checklist","resetDay(\''+k+'\')","secondary small")+'</div>')+
 '<h2>Quick schedule</h2>'+card('<div class="row">'+btn("Previous day","selectDay(\''+key(shiftDate(d,-1))+'\')","secondary")+'<div class="grow" style="text-align:center">'+escape(k)+'</div>'+btn("Next day","selectDay(\''+key(shiftDate(d,1))+'\')","secondary")+'</div>');
}
function toggleTask(id){S.done[id]=!S.done[id];save();render()}
function resetDay(k){if(confirm("Reset this day's checklist?")){Object.keys(S.done).filter(x=>x.startsWith(k+"|")).forEach(x=>delete S.done[x]);save();render()}}
let month=new Date(today().getFullYear(),today().getMonth(),1);
function viewCalendar(){
 const first=new Date(month.getFullYear(),month.getMonth(),1),offset=(first.getDay()+6)%7;
 const start=shiftDate(first,-offset);
 let html='<div class="row between"><button class="btn secondary" onclick="moveMonth(-1)">‹</button><h2>'+month.toLocaleDateString(undefined,{month:"long",year:"numeric"})+'</h2><button class="btn secondary" onclick="moveMonth(1)">›</button></div><div class="calendar">';
 ["M","T","W","T","F","S","S"].forEach(x=>html+='<div class="muted" style="text-align:center">'+x+'</div>');
 for(let i=0;i<42;i++){
  const d=shiftDate(start,i),k=key(d),t=type(d);
  html+='<button class="day '+t+' '+(k===S.selected?"selected":"")+'" onclick="selectDay(\''+k+'\')">'+d.getDate()+'<span class="mark">'+t+'</span></button>';
 }
 html+='</div><p class="muted">Tap a day to view its plan. You can override the shift for individual dates.</p>';
 return card(html)+card('<h2>Shift settings</h2><label>Rotation start date</label><input type="date" id="anchor" value="'+escape(S.anchor)+'"><label>Four-day rotation, in order</label><div class="grid">'+[0,1,2,3].map(i=>'<div><label>Day '+(i+1)+'</label><select id="cy'+i+'">'+["D","N","O","V"].map(t=>'<option value="'+t+'" '+(S.cycle[i]===t?"selected":"")+'>'+labels[t][1]+'</option>').join("")+'</select></div>').join("")+'</div><label>Selected date override</label><select id="override">'+["Auto","D","N","O","V"].map(t=>'<option value="'+t+'" '+((S.overrides[S.selected]||"Auto")===t?"selected":"")+'>'+(t==="Auto"?"Use rotation":labels[t][1])+'</option>').join("")+'</select><p>'+btn("Save schedule","saveSchedule()")+'</p>');
}
function moveMonth(n){month=new Date(month.getFullYear(),month.getMonth()+n,1);render()}
function saveSchedule(){
 S.anchor=$("#anchor").value||key(today());
 S.cycle=[0,1,2,3].map(i=>$("#cy"+i).value);
 const v=$("#override").value;
 if(v==="Auto")delete S.overrides[S.selected];else S.overrides[S.selected]=v;
 save();render();
}
function viewCoach(){
 return '<h2>Boxing coach</h2><p class="muted">Intermediate skill development. Prioritize quality, balance and defense over speed or exhaustion.</p>'+
 card('<h2>Choose a session</h2>'+Object.entries({technique:"Technical fundamentals",shadow:"Shadowboxing & combinations",conditioning:"Conditioning",recovery:"Recovery session"}).map(([k,n])=>'<div class="exercise"><div class="row between"><div class="grow"><strong>'+n+'</strong><small class="muted">'+plans[k].length+' activities</small></div>'+btn("Open","showPlan(\''+k+'\')","secondary small")+'</div></div>').join(""))+
 card('<h2>Training principles</h2><p>• Keep your guard up and return to stance after every combination.</p><p>• Practice both sides, controlled pivots and exits.</p><p>• Stop if you feel sharp pain, dizziness or unusual shortness of breath.</p><p>• Do not spar hard without a qualified coach and appropriate protective equipment.</p>');
}
function showPlan(k){
 S.currentPlan=k;
 $("#app").innerHTML='<button class="btn secondary" onclick="render()">← Back</button><h2 style="margin-top:18px">'+escape(k.toUpperCase())+' session</h2>'+card(plans[k].map((x,i)=>'<div class="exercise"><strong>'+escape(x[0])+' · '+escape(x[2])+'</strong><p class="muted">'+escape(x[1])+'</p>'+btn("Start timer","setRound('+Math.max(30,parseInt(x[2])||180)+')","secondary small")+'</div>').join(""))+
 '<p>'+btn("Start 3-minute round","setRound(180)")+'</p>';
}
let timerState={running:false,ends:0,remaining:180,mode:"Round",round:1,rounds:3,roundSec:180,restSec:60,lastSaved:0};
function restoreTimer(){
 try{
  const t=JSON.parse(localStorage.getItem("boxplan_timer")||"null");
  if(t&&Number.isFinite(t.remaining)){
   timerState={...timerState,...t,running:false};
   if(t.running&&t.ends)timerState.remaining=Math.max(0,Math.ceil((t.ends-Date.now())/1000));
  }
 }catch(e){}
}
restoreTimer();
function timerSave(){
 try{localStorage.setItem("boxplan_timer",JSON.stringify(timerState))}catch(e){}
}
function setRound(sec){
 timerState.running=false;timerState.mode="Round";
 timerState.remaining=clamp(Number(sec)||180,1,7200);
 timerState.roundSec=timerState.remaining;timerState.round=1;
 timerState.rounds=Number(S.settings.rounds)||3;
 timerState.ends=0;timerSave();S.tab="timer";render();
}
function startTimer(){
 if(timerState.remaining<=0)timerState.remaining=timerState.mode==="Rest"?timerState.restSec:timerState.roundSec;
 timerState.running=true;timerState.ends=Date.now()+timerState.remaining*1000;timerSave();render();
}
function pauseTimer(){
 if(timerState.running)timerState.remaining=Math.max(0,Math.ceil((timerState.ends-Date.now())/1000));
 timerState.running=false;timerState.ends=0;timerSave();render();
}
function resetTimer(){
 timerState.running=false;timerState.ends=0;
 timerState.remaining=timerState.mode==="Rest"?timerState.restSec:timerState.roundSec;
 timerSave();render();
}
function formatTime(s){s=Math.max(0,Math.ceil(s));return pad(Math.floor(s/60))+":"+pad(s%60)}
function timerTick(){
 if(!timerState.running)return;
 timerState.remaining=Math.max(0,Math.ceil((timerState.ends-Date.now())/1000));
 if(timerState.remaining<=0){
  timerState.running=false;timerState.ends=0;
  if(timerState.mode==="Round"&&timerState.round<timerState.rounds){
   timerState.mode="Rest";timerState.remaining=timerState.restSec;
  }else if(timerState.mode==="Rest"){
   timerState.round++;timerState.mode="Round";timerState.remaining=timerState.roundSec;
  }
  timerSave();
  if(navigator.vibrate)try{navigator.vibrate([250,100,250])}catch(e){}
  render();
 }else if(Date.now()-timerState.lastSaved>1000){
  timerState.lastSaved=Date.now();timerSave();
 }
}
setInterval(timerTick,250);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&timerState.running)timerTick()});
function viewTimer(){
 const t=timerState;
 const total=t.mode==="Rest"?t.restSec:t.roundSec;
 const pct=total?100*(1-t.remaining/total):0;
 return '<h2>Round timer</h2>'+card('<div class="row between"><span class="badge">'+escape(t.mode)+'</span><span class="muted">Round '+t.round+' / '+t.rounds+'</span></div><div class="timer" id="clock">'+formatTime(t.remaining)+'</div><div style="text-align:center" class="muted">'+(t.running?"Timer running":t.remaining===0?"Finished":"Ready")+'</div><div class="timerbar"><div style="width:'+pct+'%"></div></div><div class="row">'+(t.running?btn("Pause","pauseTimer()"):btn("Start","startTimer()"))+btn("Reset","resetTimer()","secondary")+'</div><div class="preset">'+[30,60,180,300].map(n=>btn(n<60?n+" sec":n/60+" min","setRound("+n+")","secondary small")).join("")+'</div><div class="grid"><div><label>Round length (sec)</label><input id="roundSec" type="number" min="1" max="7200" value="'+t.roundSec+'"></div><div><label>Rest (sec)</label><input id="restSec" type="number" min="0" max="1800" value="'+t.restSec+'"></div><div><label>Rounds</label><input id="rounds" type="number" min="1" max="20" value="'+t.rounds+'"></div></div><p>'+btn("Apply timer settings","applyTimerSettings()","secondary")+'</p>')+
 card('<h2>Timer tip</h2><p class="muted">The countdown uses a real end timestamp, so it catches up when your phone locks or the browser goes into the background. Keep this page open when possible; browser notifications and sounds may be restricted by your phone.</p>');
}
function applyTimerSettings(){
 const rs=clamp(Number($("#roundSec").value)||180,1,7200);
 const rest=clamp(Number($("#restSec").value)||0,0,1800);
 const rounds=clamp(Number($("#rounds").value)||3,1,20);
 timerState.running=false;timerState.ends=0;timerState.roundSec=rs;
 timerState.restSec=rest;timerState.rounds=rounds;timerState.round=1;
 timerState.mode="Round";timerState.remaining=rs;timerSave();render();
}
function viewProgress(){
 const k=S.selected||key(today()),r=recovery(dateOf(k));
 return '<h2>Progress & recovery</h2>'+card('<div class="grid"><div class="stat"><div class="muted">Tasks completed</div><div class="big">'+totalCompleted()+'</div></div><div class="stat"><div class="muted">Training days this week</div><div class="big">'+weekStats()+'</div></div><div class="stat"><div class="muted">Logged sessions</div><div class="big">'+sessionCount()+'</div></div></div>')+
 card('<h2>Daily recovery log</h2><p class="muted">Selected date: '+escape(k)+'</p><label>Sleep (hours)</label><input id="sleep" type="number" min="0" max="24" step=".5" value="'+r.sleep+'"><label>Energy (1–5)</label><input id="energy" type="number" min="1" max="5" value="'+r.energy+'"><label>Muscle soreness (1–5)</label><input id="soreness" type="number" min="1" max="5" value="'+r.soreness+'"><p>'+btn("Save recovery","saveRecovery()")+'</p><p class="muted">Use this log to adjust the recommended session. Stop training if you are ill or injured.</p>')+
 card('<h2>Training log</h2><p class="muted">Record a session you completed outside the checklist.</p><label>Session</label><input id="logName" type="text" placeholder="e.g. Boxing class, footwork"><label>Minutes</label><input id="logMinutes" type="number" min="1" max="600" value="45"><p>'+btn("Log session","logSession()")+'</p>'+S.history.slice(-12).reverse().map(x=>'<div class="exercise"><strong>'+escape(x.name)+'</strong><div class="muted">'+escape(x.date)+' · '+x.minutes+' min</div></div>').join(""));
}
function saveRecovery(){
 const k=S.selected||key(today());
 S.recovery[k]={sleep:clamp(Number($("#sleep").value)||0,0,24),energy:clamp(Number($("#energy").value)||1,1,5),soreness:clamp(Number($("#soreness").value)||1,1,5)};
 save();render();
}
function logSession(){
 const name=$("#logName").value.trim(),minutes=clamp(Number($("#logMinutes").value)||0,1,600);
 if(!name){alert("Enter a session name first.");return}
 S.history.push({name,minutes,date:S.selected||key(today())});
 save();render();
}
function exportData(){
 const data={boxplan:S,legacy:JSON.parse(localStorage.getItem("bp")||"{}")};
 const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
 const url=URL.createObjectURL(blob),a=document.createElement("a");
 a.href=url;a.download="boxplan-backup-"+key(today())+".json";a.click();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function importData(file){
 const reader=new FileReader();
 reader.onload=()=>{
  try{
   const data=JSON.parse(reader.result);
   const obj=data.boxplan||data;
   if(!obj||typeof obj!=="object")throw Error("Invalid backup");
   if(!confirm("Import backup and replace current BoxPlan settings?"))return;
   S={...defaults,...obj};
   save();render();alert("Backup imported.");
  }catch(e){alert("Could not import this backup file.")}
 };
 reader.readAsText(file);
}
function viewSettings(){
 return card('<h2>Data & settings</h2><p class="muted">Your data is stored locally in this browser. Keep backups before clearing browser data or switching devices.</p><p>'+btn("Export backup","exportData()")+'</p><label>Restore a BoxPlan JSON backup</label><input type="file" accept=".json,application/json" onchange="importData(this.files[0])"><p>'+btn("Return to Today","tab(\'today\')","secondary")+'</p>');
}
render();
</script>
</body>
</html>
