<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BoxPlan</title><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="BoxPlan"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#060813">
<style>
:root{--bg:#f3f1ec;--card:#fff;--ink:#15172a;--mut:#6a6f88;--line:#dedad0;--acc:#e2452b;--day:#b87a00;--dayb:#fdf0cc;--night:#4a52d6;--nightb:#e3e5fc;--vac:#13875a;--vacb:#d6f2e5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#060813;--card:#0f1228;--ink:#eceeff;--mut:#868cb0;--line:#1e2347;--acc:#ff6a4d;--day:#f7b92c;--dayb:#2a2108;--night:#8a91ff;--nightb:#11153a;--vac:#33d695;--vacb:#0c2a21;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#060813;--card:#0f1228;--ink:#eceeff;--mut:#868cb0;--line:#1e2347;--acc:#ff6a4d;--day:#f7b92c;--dayb:#2a2108;--night:#8a91ff;--nightb:#11153a;--vac:#33d695;--vacb:#0c2a21;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%}
main{flex:1;overflow-y:auto;padding:16px 16px 28px}
nav{display:flex;background:var(--card);border-top:1px solid var(--line)}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:8px 0 10px;font:600 12px system-ui;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:20px;filter:grayscale(1);opacity:.7}nav button.on{color:var(--acc)}nav button.on b{filter:none;opacity:1}
h1{font:800 22px/1.15 system-ui;margin:0;letter-spacing:-.01em}h2{font:700 16px system-ui;margin:22px 0 8px}
.row{display:flex;align-items:center;gap:10px}.c{flex:1;text-align:center}
.ic{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:22px}
.banner{display:flex;gap:14px;align-items:center;border-radius:16px;padding:14px 16px;margin:14px 0 4px;border:1px solid var(--line);background:var(--card)}
.banner span{font-size:34px}.banner small{display:block;color:var(--mut)}.banner b{font-size:18px}
.banner.D{background:var(--dayb);border-color:var(--day)}.banner.N{background:var(--nightb);border-color:var(--night)}.banner.V{background:var(--vacb);border-color:var(--vac)}
.it{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:8px}
.it input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--acc);flex:none}.it i{font-style:normal;font-size:22px}
.it p{margin:1px 0 0;color:var(--mut)}.it.dn{opacity:.5}.it.dn p{text-decoration:line-through}
.pill{font:700 11px system-ui;background:var(--acc);color:#fff;border-radius:99px;padding:2px 8px;margin-left:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.grid>div{text-align:center;color:var(--mut);font-weight:600;font-size:12px}
.cd{aspect-ratio:1;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 16px system-ui;position:relative;padding:0}
.cd span{font-size:14px;line-height:1}.cd.D{background:var(--dayb);border-color:var(--day);color:var(--day)}.cd.N{background:var(--nightb);border-color:var(--night);color:var(--night)}.cd.V{background:var(--vacb);border-color:var(--vac);color:var(--vac)}
.cd.td{outline:2px solid var(--acc);outline-offset:1px}.cd u{position:absolute;right:6px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--acc)}
.btn{border:0;border-radius:12px;background:var(--acc);color:#fff;font:700 15px system-ui;padding:11px 16px}.btn.g{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.tb{border-radius:22px;padding:26px 10px;text-align:center;background:var(--card);border:1px solid var(--line)}
.tb.work{background:var(--acc);color:#fff}.tb.rest{background:var(--vacb);color:var(--vac)}.tb.prep{background:var(--dayb);color:var(--day)}
#tm{font:800 84px/1 ui-monospace,Menlo,monospace;letter-spacing:-.03em}#ph{font:800 20px system-ui}
.fs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.fs label{font-size:12px;color:var(--mut)}
input[type=number]{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:700 17px system-ui}
.big{display:flex;gap:10px}.big>div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}.big b{font:800 34px/1 system-ui;display:block}.big span{color:var(--mut)}
.kit{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.kit input{accent-color:var(--acc);width:20px;height:20px}
.fg{width:100%;height:150px;background:var(--bg);border-radius:12px;display:block}
.mc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin:8px 0 12px}.mc ol{margin:6px 0;padding-left:20px}
.frm label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}.frm .kit{display:flex;font-size:15px;color:var(--ink);margin:0}
input[type=text],input[type=date],select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 16px system-ui}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;height:46px;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
</style></head><body><div id="app"><main id="main"></main><nav id="nav"></nav></div>
<script>
const VER=6;
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
let S={};try{S=JSON.parse(localStorage.getItem('bp')||'{}')}catch(e){}
S.ov=S.ov||{};S.done=S.done||{};S.wt=S.wt||[];S.kit=S.kit||{};S.cfg=S.cfg||{club:2,price:0};
const save=()=>{try{localStorage.setItem('bp',JSON.stringify(S))}catch(e){}};
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addD=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const DAYS="10-02 10-03 10-10 10-11 10-18 10-19 10-26 10-27 11-03 11-04 11-11 11-12 11-19 11-20 11-27 11-28".split(' ');
const NIGHTS="10-05 10-06 10-07 10-08 10-12 10-14 10-15 10-22 10-23 10-30 10-31 11-07 11-08 11-15 11-16 11-23 11-24".split(' ');
function base(d){const k=key(d);if(k>='2026-10-15'&&k<='2026-10-28')return'V';
 if(k>='2026-10-01'&&k<='2026-11-30'){const m=k.slice(5);return DAYS.includes(m)?'D':NIGHTS.includes(m)?'N':'O'}
 if(k>='2026-12-01'){const n=Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(2026,11,1))/864e5),p=n%8;return p<2?'N':(p==4||p==5)?'D':'O'}
 return'O'}
const type=d=>S.ov[key(d)]||base(d);
const M={D:['☀️','Day shift','09:00 – 21:00'],N:['🌙','Night shift','21:00 – 09:00'],O:['💤','Day off','Heavy training day'],V:['🏖️','Vacation','Training camp']};
const BX=[['20:40','Бокс, Alatar Team']],CL=[[],[],BX,[],BX,[],[['15:00','Бокс, Alatar Team']]];
const AM=['Active recovery: 30 min walk + 20 min stretching','Easy run 35–40 min + 10 min core (plank, leg raises)','Strength A, 45 min: squats, push-ups, rows, lunges, plank. 4 rounds','Intervals: 8 × (30 s sprint / 90 s walk), then rope 5 × 3 min','Strength B, 45 min: deadlifts, pull-ups, med-ball slams, core','Tempo run 25 min + shadowboxing 4 × 3 min','Rope 3 × 3 min + shadowboxing 3 × 3 min + mobility'];
const SH=['Rope 5 × 3 min + shadowboxing 3 × 3 min + core 5 min','Easy run 25 min + 3 × 15 push-ups + 3 × 8 pull-ups'];
const H=['💧 2.5 L water','🥩 Protein in every meal','🧘 10 min stretching','😴 Sleep 7 h or more'];
const KIT=['Gloves 12–16 oz','Hand wraps','Mouthguard','Jump rope','Boxing shoes','Headgear (for sparring)','Medical certificate (справка)','Towel, shower kit, flip-flops, clean clothes','Water bottle'];
const NS='Shadowboxing 4 × 3 min + rope 3 × 3 min + bodyweight circuit',TECH='Technique at home, 30 min: shadowboxing 5 × 3 min (jab–cross, footwork, defence)';
const fm=m=>pad(Math.floor(m/60)%24)+':'+pad(m%60),tm=s=>+s.slice(0,2)*60+ +s.slice(3);
const el=x=>{const w=x.getDay(),t=type(x);if(!CL[w].length)return false;if(t=='O'||t=='V')return true;return w==6&&t=='N'&&type(addD(x,-1))!='N'};
function clubOn(d){const st=new Date((S.cfg.start||'2026-10-15')+'T00:00'),n=Math.round((d-st)/864e5);if(n<0||n>29||!el(d))return false;let c=0;for(let i=0;i<n;i++)if(el(addD(st,i)))c++;return c<12}
function plan0(d){const t=type(d),w=d.getDay(),pv=type(addD(d,-1))=='N',nx=type(addD(d,1)),L=[],a=(t,i,x,tr,cl,mv)=>L.push({t,i,x,tr,cl,mv});
 const cb=()=>{const s=tm(CL[w][0][0]);a(fm(s-150),'🍌','Light meal 2 h before: rice or pasta + banana');a(fm(s-45),'🚌','Leave home (30 min to the gym). Bag: gloves, wraps, mouthguard, towel, shower kit, clean clothes');a(fm(s),'🥊',CL[w][0][1]+', about 90 min',1,1);a(fm(s+90),'🚿','Shower and change at the gym (about 20 min)');a(fm(s+110),'🚌','Travel home (30 min), protein meal when you arrive')};
 if(t=='D'){a('05:45','⏰','Wake up, 500 ml water, light breakfast');a('06:00','🏃',SH[d.getDate()%2]+' (40 min)',1,0,SHM[d.getDate()%2]);a('06:50','🚿','Shower at home, get ready');a('07:45','🚌','Leave home (1 h to work)');a('13:00','🍽️','Mid-shift meal: protein + carbs, nothing heavy or fried');a('21:00','🏁','Shift ends. Travel home (1 h)');a('22:10','🧘','Dinner + 10 min stretching');a(nx=='D'?'22:45':'23:30','😴',nx=='D'?'Lights out, early start tomorrow':'Lights out, 7+ hours of sleep')}
 else if(t=='N'){if(pv){a('09:00','🏁','Shift ends. Travel home (1 h)');a('10:15','😴','Light meal, shower, sleep 10:45–17:00 in a dark room');a('17:15','🥊',NS+' (40 min, moderate)',1,0,['jab','slip','rope']);a('18:15','🚿','Shower, then main meal')}else if(clubOn(d)){cb();a('17:35','😴','Nap 90 min: you start work at 21:00')}else{a('13:30','😴','Nap 90 min to prepare for the night');a('16:00','🥊',NS+' (40 min, moderate)',1,0,['jab','slip','rope']);a('16:50','🚿','Shower, then main meal')}a('19:45','🚌','Leave home (1 h to work). Pack water, fruit, nuts, protein bar');a('01:00','🥜','Night snack: banana, nuts or yogurt. No caffeine after 03:00')}
 else{const club=clubOn(d);
  if(pv)a('09:30','😴','Sleep 10:00–16:00. Recovery comes first');
  else{a(t=='V'?'07:30':'08:00','🏃',AM[w]+(club?'. Keep it easy, club today':''),w!=0,0,AMM[w]);a('09:30','🚿','Shower, breakfast: protein + carbs')}
  if(club)cb();
  else if(w==0&&!pv)a('17:30','🧘','Rest day: 30 min walk, stretching, meal prep');
  else a('17:30','🥊',pv?'Light home session: shadowboxing 3 × 3 min + rope 3 × 3 min + mobility':TECH,1,0,['jab','slip']);
  if(club&&nx=='D')a('23:30','😴','Sleep right away: short night before the day shift');else if(nx=='N')a('23:59','😴','Night shift tomorrow: go to bed late (00:30) and sleep in');
  else a(nx=='D'?'22:30':'23:30','😴',nx=='D'?'In bed by 22:30, early start tomorrow':'Lights out, 7+ hours of sleep')}
 return L}
const today=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())};
let tab=S.me?'today':'prog',sel=today(),cm={y:sel.getFullYear(),m:sel.getMonth()},edit=false;
function vToday(){const t=type(sel),m=M[t],k=key(sel),P=plan(sel),n=P.filter((p,i)=>S.done[k+'|'+p.id]).length,isT=k==key(today());
 return`<div class="row"><button class="ic" onclick="mv(-1)">‹</button><div class="c"><h1>${isT?'Today':sel.toLocaleDateString('en-GB',{weekday:'long'})}</h1><small style="color:var(--mut)">${sel.toLocaleDateString('en-GB',{day:'numeric',month:'long'})}</small></div><button class="ic" onclick="mv(1)">›</button></div>
 <div class="banner ${t}"><span>${m[0]}</span><div><b>${m[1]}</b><small>${m[2]}</small></div></div>
 <p style="color:var(--mut);margin:10px 0 0">💡 ${TIPS[Math.floor(sel.getTime()/864e5)%TIPS.length]}</p>${ME().hurt?`<p style="margin:6px 0 0">⚠️ Protect: ${ME().hurt}. Skip or lighten any move that hurts.</p>`:''}<h2>Plan · ${n}/${P.length} done</h2>${P.map((p,i)=>`<label class="it${S.done[k+'|'+p.id]?' dn':''}"><input type="checkbox" ${S.done[k+'|'+p.id]?'checked':''} onchange="tg('${k}|${p.id}')"><i>${p.i}</i><div><b>${p.t}</b>${p.cl?'<span class="pill">Club</span>':p.tr?'<span class="pill">Train</span>':''}<p>${p.x}</p>${p.mv&&p.mv.length?`<button class="chip" style="margin-top:6px" onclick="om('${k}|${p.id}')">${OM[k+'|'+p.id]?'Hide':'Show'} moves ▾</button>`:''}</div></label>${p.mv&&p.mv.length&&OM[k+'|'+p.id]?p.mv.map(mvCard).join(''):''}`).join('')}
 <h2>Daily basics</h2>${H.map((h,i)=>`<label class="it${S.done[k+'|h'+i]?' dn':''}"><input type="checkbox" ${S.done[k+'|h'+i]?'checked':''} onchange="tg('${k}|h${i}')"><div>${h}</div></label>`).join('')}`}
function vCal(){const{y,m}=cm,off=(new Date(y,m,1).getDay()+6)%7,dim=new Date(y,m+1,0).getDate(),c={D:0,N:0,V:0},tk=key(today());let g='<i></i>'.repeat(off);
 for(let d=1;d<=dim;d++){const dt=new Date(y,m,d),t=type(dt),k=key(dt);if(c[t]!=null)c[t]++;const dn=plan(dt).some((p,i)=>p.tr&&S.done[k+'|'+p.id]);g+=`<button class="cd ${t}${k==tk?' td':''}" onclick="pick(${y},${m},${d})">${d}<span>${t=='O'?'':M[t][0]}</span>${dn?'<u></u>':''}</button>`}
 return`<div class="row"><button class="ic" onclick="cmv(-1)">‹</button><div class="c"><h1>${new Date(y,m,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</h1></div><button class="ic" onclick="cmv(1)">›</button></div>
 <div class="chips"><span class="chip">☀️ ${c.D}</span><span class="chip">🌙 ${c.N}</span><span class="chip">🏖️ ${c.V}</span></div>
 <div class="grid">${'Mo Tu We Th Fr Sa Su'.split(' ').map(x=>`<div>${x}</div>`).join('')}${g}</div>
 <p style="color:var(--mut)">${edit?'Edit mode: tap a day to switch day → night → off → vacation.':'Tap a day to see its plan. A red dot means you trained.'}</p>
 <button class="btn ${edit?'':'g'}" onclick="edit=!edit;render()">${edit?'Done editing':'✏️ Edit shifts'}</button>`}
const PR=[['Boxing',3,180,60],['Shadow',5,180,45],['Sprints',8,20,10],['Rope',6,180,60]];
let T={r:3,w:180,s:60,run:0,ph:'idle',i:1,end:0,left:0,w10:0};
function vTimer(){return`<h1>Round timer</h1><div class="chips">${PR.map((p,i)=>`<button class="chip" onclick="pre(${i})">${p[0]} ${p[1]}×${p[2]>=60?p[2]/60+'m':p[2]+'s'}</button>`).join('')}</div>
 <div class="tb" id="tb"><div id="ph"></div><div id="tm"></div><div id="rd" style="color:inherit;opacity:.8"></div></div>
 <div class="fs"><div><label>Rounds</label><input type="number" id="ir" value="${T.r}" onchange="T.r=+this.value||1;upd()"></div><div><label>Work (sec)</label><input type="number" id="iw" value="${T.w}" onchange="T.w=+this.value||10;upd()"></div><div><label>Rest (sec)</label><input type="number" id="is" value="${T.s}" onchange="T.s=+this.value||0;upd()"></div></div>
 <div class="row"><button class="btn" style="flex:2" id="go" onclick="ts()">Start</button><button class="btn g" style="flex:1" onclick="T.run=0;T.ph='idle';upd()">Reset</button></div>
 <p style="color:var(--mut)">10 s get-ready, bell at each round start, warning beeps 10 s before the round ends.</p>`}
let AC;const ac=()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)()}catch(e){}};
function bp(f,d,n=1){try{ac();for(let k=0;k<n;k++){const o=AC.createOscillator(),g=AC.createGain(),t0=AC.currentTime+k*.25;o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.3,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.start(t0);o.stop(t0+d)}navigator.vibrate&&navigator.vibrate(200)}catch(e){}}
function nx(){if(T.ph=='prep'){T.ph='work';T.i=1}else if(T.ph=='work'){if(T.i>=T.r){T.ph='done';T.run=0;bp(440,.5,3);upd();return}if(T.s)T.ph='rest';else T.i++}else{T.ph='work';T.i++}T.w10=0;T.end=Date.now()+(T.ph=='work'?T.w:T.s)*1000;bp(T.ph=='work'?880:520,.5);upd()}
function ts(){if(T.run){T.left=T.end-Date.now();T.run=0}else{if(T.ph=='idle'||T.ph=='done'){T.ph='prep';T.i=1;T.left=10000;T.w10=0}T.end=Date.now()+T.left;T.run=1;ac()}upd()}
setInterval(()=>{if(!T.run)return;const l=T.end-Date.now();if(l<=0)nx();else{if(T.ph=='work'&&l<=10500&&!T.w10&&T.w>20){T.w10=1;bp(660,.15,2)}upd()}},200);
function pre(i){T.r=PR[i][1];T.w=PR[i][2];T.s=PR[i][3];T.run=0;T.ph='idle';render()}
function upd(){const e=$('#tm');if(!e)return;const ms=T.run?T.end-Date.now():T.ph=='idle'?T.w*1000:T.left,s=Math.max(0,Math.ceil(ms/1000));e.textContent=pad(Math.floor(s/60))+':'+pad(s%60);$('#ph').textContent={idle:'Ready',prep:'Get ready',work:'Fight!',rest:'Rest',done:'Done 🔔'}[T.ph];$('#rd').textContent=T.ph=='idle'?T.r+' rounds':'Round '+T.i+' / '+T.r;$('#tb').className='tb '+T.ph;$('#go').textContent=T.run?'Pause':'Start'}
function vProg(){const n=today(),mon=addD(n,-((n.getDay()+6)%7));let wk=0,mo=0,cl=0,cu=0;const st=new Date((S.cfg.start||'2026-10-15')+'T00:00'),en=addD(st,29);for(let i=0;i<30;i++){const dt=addD(st,i),k=key(dt);cu+=plan(dt).filter(p=>p.cl&&S.done[k+'|'+p.id]).length}
 for(let i=0;i<30;i++){const dt=addD(n,-i),k=key(dt),c=plan(dt).filter((p,j)=>p.tr&&S.done[k+'|'+p.id]).length?1:0;mo+=c;cl+=plan(dt).filter((p,j)=>p.cl&&S.done[k+'|'+p.id]).length;if(dt>=mon)wk+=c}
 const w=S.wt,d=w.length>1?(w[w.length-1].kg-w[0].kg).toFixed(1):null;
 return`<h2>Progress</h2><div class="big"><div><b>${wk}/${ME().days||5}</b><span>training days this week</span></div><div><b>${mo}</b><span>training days, last 30 days</span></div></div>
 <h2>Club subscription</h2><div class="fs" style="grid-template-columns:1fr 1fr"><div><label>First day (30 days)</label><input type="date" value="${S.cfg.start||'2026-10-15'}" onchange="S.cfg.start=this.value;save();render()"></div><div><label>Price (₽)</label><input type="number" value="${S.cfg.price||4000}" onchange="S.cfg.price=+this.value||0;save();render()"></div></div><div class="big"><div><b>${cu}/12</b><span>classes attended</span></div><div><b>${Math.max(0,12-cu)}</b><span>left, ends ${en.toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</span></div></div><p style="color:var(--mut)">${cu?Math.round((S.cfg.price||4000)/cu)+' ₽ per class so far.':'Tick the Club items in Today to count your classes.'}</p><h2>Body weight</h2><div class="row"><input type="number" step="0.1" id="kg" placeholder="kg" style="flex:1"><button class="btn" onclick="aw()">Add</button></div>
 <p style="color:var(--mut)">${w.length?w.slice(-6).reverse().map(x=>x.d.slice(5)+': '+x.kg+' kg').join(' · ')+(d!==null?'<br>Change since first entry: '+(d>0?'+':'')+d+' kg':''):'Weigh yourself in the morning, same conditions each time.'}</p>
